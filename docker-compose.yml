version: '3.8'

services:
  # Database Service (MySQL)
  db:
    image: mysql:8.0
    container_name: clinique-db
    environment:
      MYSQL_DATABASE: clinique_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD: ""
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - clinique-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Backend Service (Spring Boot API)
  backend:
    build:
      context: ./backend_Springboot
      dockerfile: Dockerfile
    container_name: clinique-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/clinique_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinique-network

  # Frontend Service (Angular + Nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend_Dockerfile
    container_name: clinique-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - clinique-network

volumes:
  mysqldata:

networks:
  clinique-network:
    driver: bridge
