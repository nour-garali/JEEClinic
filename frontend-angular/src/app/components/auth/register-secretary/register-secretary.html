<div class="min-h-screen bg-[#F8FAFC] flex items-center justify-center p-4 font-['Outfit']">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
    
    <!-- Header -->
    <div class="bg-[#1a3c53] p-8 text-center relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-[#305D7A] to-[#1a3c53] opacity-90"></div>
        <div class="relative z-10 flex flex-col items-center">
            <div class="bg-white/20 p-3 rounded-2xl backdrop-blur-md mb-4 border border-white/30">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    <circle cx="12" cy="10" r="3" fill="white" />
                </svg>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">Configuration Secrétaire</h1>
            <p class="text-blue-100 text-sm mt-1">Finalisez votre compte ProHealth</p>
        </div>
    </div>

    <!-- Content -->
    <div class="p-8">
        <div *ngIf="isValidating" class="flex flex-col items-center py-10">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-100 border-t-[#305D7A] mb-4"></div>
            <p class="text-slate-500 font-medium italic">Validation de votre invitation...</p>
        </div>

        <div *ngIf="!isValidating && !isTokenValid">
            <div class="bg-rose-50 border border-rose-100 text-rose-700 px-6 py-8 rounded-2xl text-center">
                <svg class="w-16 h-16 mx-auto text-rose-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h3 class="text-xl font-bold mb-2">Lien invalide</h3>
                <p class="text-sm font-medium mb-6 opacity-80">{{ errorMessage }}</p>
                <a routerLink="/login" class="inline-flex items-center text-[#305D7A] font-bold hover:underline">
                    Retour à la connexion
                    <svg class="ml-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </a>
            </div>
        </div>

        <div *ngIf="!isValidating && isTokenValid">
            <p class="text-slate-500 text-sm mb-8 text-center font-medium px-4">
                Bienvenue dans l'équipe de gestion ProHealth. Veuillez définir votre mot de passe pour activer votre accès.
            </p>

            <form (ngSubmit)="onSubmit()" class="space-y-5">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase text-slate-500 tracking-wider">Nouveau Mot de Passe</label>
                    <div class="relative group">
                        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-[#305D7A] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <input type="password" [(ngModel)]="newPassword" name="password" required
                            class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-[#305D7A] transition-all font-medium text-slate-800"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase text-slate-500 tracking-wider">Confirmer le Mot de Passe</label>
                    <div class="relative group">
                        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-[#305D7A] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
                            class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-[#305D7A] transition-all font-medium text-slate-800"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" [disabled]="isSubmitting"
                        class="w-full py-4 bg-[#305D7A] hover:bg-[#1a3c53] disabled:bg-slate-300 text-white font-black rounded-2xl transition-all shadow-xl shadow-blue-900/20 active:scale-[0.98] flex items-center justify-center gap-3">
                        <span *ngIf="!isSubmitting">ACTIVER MON COMPTE</span>
                        <div *ngIf="isSubmitting" class="animate-spin rounded-full h-5 w-5 border-2 border-white/30 border-t-white"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>
  </div>
</div>
