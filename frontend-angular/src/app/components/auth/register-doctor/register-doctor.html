<div class="min-h-screen bg-[#f8fafc] flex items-center justify-center p-6 font-['Inter']">
  
  <!-- Decorative background elements -->
  <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-100 rounded-full blur-3xl opacity-50"></div>
    <div class="absolute top-1/2 -right-24 w-80 h-80 bg-indigo-50 rounded-full blur-3xl opacity-60"></div>
  </div>

  <div class="w-full max-w-md">
    <!-- Logo area -->
    <div class="flex flex-col items-center mb-8">
      <div class="bg-[#1a3c53] p-3 rounded-2xl shadow-xl mb-4">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <circle cx="12" cy="10" r="3" fill="white" />
        </svg>
      </div>
      <h1 class="text-2xl font-black text-slate-800 tracking-tight">ProHealth</h1>
      <p class="text-slate-500 font-medium">Activation de compte médecin</p>
    </div>

    <!-- MAIN CARD -->
    <div class="bg-white rounded-[2rem] shadow-2xl shadow-blue-900/10 border border-slate-100 p-8 md:p-10 relative overflow-hidden">
      
      <!-- LOADING STATE -->
      <div *ngIf="isValidating" class="flex flex-col items-center py-12">
        <div class="w-12 h-12 border-4 border-slate-100 border-t-[#305D7A] rounded-full animate-spin mb-4"></div>
        <p class="text-slate-600 font-medium italic">Vérification de votre invitation...</p>
      </div>

      <!-- ERROR STATE -->
      <div *ngIf="!isValidating && !isTokenValid" class="text-center py-6">
        <div class="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h2 class="text-xl font-bold text-slate-800 mb-2">Oups !</h2>
        <p class="text-slate-500 mb-8">{{ errorMessage }}</p>
        <button routerLink="/login" class="w-full py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-2xl transition-all">
          Retour à la connexion
        </button>
      </div>

      <!-- SUCCESS / PASSWORD FORM -->
      <div *ngIf="!isValidating && isTokenValid">
        <div class="mb-8">
          <h2 class="text-xl font-bold text-slate-800 mb-2">Bienvenue Docteur !</h2>
          <p class="text-slate-500 text-sm leading-relaxed">Veuillez définir votre mot de passe pour activer votre accès sécurisé à la plateforme.</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-6">
          <div class="space-y-2">
            <label class="text-xs font-bold uppercase text-slate-500 tracking-wider ml-1">Nouveau mot de passe</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
              </span>
              <input type="password" [(ngModel)]="newPassword" name="password" required placeholder="••••••••" class="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-[#305D7A] transition-all font-medium">
            </div>
          </div>

          <div class="space-y-2">
            <label class="text-xs font-bold uppercase text-slate-500 tracking-wider ml-1">Confirmer le mot de passe</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
              </span>
              <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required placeholder="••••••••" class="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-[#305D7A] transition-all font-medium">
            </div>
          </div>

          <button type="submit" [disabled]="isSubmitting" class="w-full py-4 bg-[#305D7A] hover:bg-[#1a3c53] text-white font-bold rounded-2xl shadow-lg shadow-blue-900/20 transition-all transform active:scale-[0.98] disabled:opacity-50 disabled:pointer-events-none flex items-center justify-center gap-3">
            <span *ngIf="isSubmitting" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            {{ isSubmitting ? 'Activation en cours...' : 'Activer mon compte' }}
          </button>
        </form>
      </div>

    </div>

    <!-- Footer link -->
    <p class="text-center mt-8 text-slate-400 text-sm font-medium">
      Problème avec votre invitation ? <a href="mailto:support@prohealth.com" class="text-blue-600 hover:underline">Contactez le support</a>
    </p>
  </div>
</div>
